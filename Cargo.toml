[package]
name = "alphabetvm"
description = "Simple custom self-contained VM"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/adambyle/alphabet"
readme = "README.md"

[features]
tui = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.29.0", optional = true }

[[bin]]
name = "alphabet_tui"
required-features = ["tui"]
